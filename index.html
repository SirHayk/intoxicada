<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>intoxicada (141414)</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/meyer-reset/2.0/reset.min.css">

  <style>
    /* ───────── Base ───────── */
    body {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 24px 16px;
      background: #080808;
      font-family: "Helvetica Neue", Arial, sans-serif;
      color: #fff;
    }

    /* ───────── Escena: gif + texto en movimiento ───────── */
    .stage {
      position: relative;
      width: clamp(320px, 50vw, 760px);
      max-width: 94vw;
      isolation: isolate;
    }

    .stage > img {
      position: absolute;
      z-index: 0;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 60%;
    }

    .stage > svg {
      position: relative;
      z-index: 1;
      display: block;
      width: 100%;
      opacity: 0.7;
    }

    path {
      fill: transparent;
    }

    text {
      font-size: 8px;
      fill: transparent;
      stroke: #fff;
      stroke-width: 0.3;
      font-family: arial, cursive;
      font-weight: bold;
    }

    /* Frase 1: relleno blanco con destello gris que la recorre por dentro */
    #text-1 {
      fill: url(#shine-1);
      stroke: none;
    }

    /* Frase 2: contorno blanco, el destello gris pasa por el interior de las letras */
    #text-2 {
      fill: url(#shine-2);
    }

    /* ───────── Dock: reproductor + perfil ───────── */
    /* El dock cuelga justo debajo de la escena sin empujarla:
       así el texto y la imagen central siempre quedan en el centro de la pantalla */
    .dock {
      --ease: cubic-bezier(.22, 1, .36, 1);
      position: absolute;
      top: 100%;
      left: 50%;
      transform: translateX(-50%);
      margin-top: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      width: max-content;
      max-width: 94vw;
      z-index: 2;
    }

    /* Reproductor */
    .player {
      width: 240px;
      max-width: 80vw;
      padding: 10px 12px 9px;
      border-radius: 14px;
      background: linear-gradient(160deg, rgba(255,255,255,.07), rgba(255,255,255,.02));
      border: 1px solid rgba(255,255,255,.09);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      box-shadow: 0 12px 32px rgba(0,0,0,.55);
    }

    .track-info {
      text-align: center;
      margin-bottom: 8px;
      min-height: 24px;
    }
    .track-title {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: .02em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .track-artist {
      margin-top: 2px;
      font-size: 10px;
      color: #8d8d8d;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Barra de progreso */
    .progress-row {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 9px;
      color: #7d7d7d;
      font-variant-numeric: tabular-nums;
    }
    .progress-row span { width: 24px; }
    .progress-row span:last-child { text-align: right; }

    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      height: 3px;
      border-radius: 3px;
      outline: none;
      cursor: pointer;
      background: linear-gradient(to right, #d9d9d9 var(--fill, 0%), rgba(255,255,255,.14) var(--fill, 0%));
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 9px; height: 9px;
      border-radius: 50%;
      background: #fff;
      border: 0;
      box-shadow: 0 0 0 3px rgba(255,255,255,.08);
      transition: transform .15s;
    }
    input[type="range"]::-moz-range-thumb {
      width: 9px; height: 9px;
      border-radius: 50%;
      background: #fff;
      border: 0;
    }
    input[type="range"]:hover::-webkit-slider-thumb { transform: scale(1.25); }
    input[type="range"]:focus-visible { outline: 2px solid rgba(255,255,255,.5); outline-offset: 4px; }

    #seek { flex: 1; }

    /* Controles */
    .controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-top: 8px;
    }
    .transport {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .btn {
      display: grid;
      place-items: center;
      width: 26px; height: 26px;
      border: 0;
      border-radius: 50%;
      background: transparent;
      color: #cfcfcf;
      cursor: pointer;
      transition: color .2s, background .2s, transform .15s;
    }
    .btn:hover { color: #fff; background: rgba(255,255,255,.08); }
    .btn:active { transform: scale(.92); }
    .btn:focus-visible { outline: 2px solid rgba(255,255,255,.6); outline-offset: 2px; }
    .btn svg { width: 14px; height: 14px; fill: currentColor; }

    .btn-play, .btn-pause {
      width: 30px; height: 30px;
      background: rgba(255,255,255,.1);
      color: #e6e6e6;
    }
    .btn-play svg, .btn-pause svg { width: 15px; height: 15px; }
    /* El botón que corresponde al estado actual se resalta */
    .btn-play.is-on, .btn-pause.is-on { background: #f2f2f2; color: #0a0a0a; }
    .btn-play.is-on:hover, .btn-pause.is-on:hover { background: #fff; }

    .volume {
      display: flex;
      align-items: center;
      gap: 2px;
    }
    #volume { width: 44px; }

    /* Perfil circular */
    .profile {
      flex: 0 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      width: 96px;
      text-decoration: none;
      color: inherit;
    }
    .profile-img {
      display: block;
      width: 80px;
      height: 80px;
      border-radius: 50%;
      object-fit: cover;
      background: #1a1a1a;
      border: 1px solid rgba(255,255,255,.18);
      box-shadow: 0 10px 30px rgba(0,0,0,.5);
      transition: transform .3s, border-color .3s;
    }
    .profile-name {
      max-width: 100%;
      font-size: 13px;
      font-weight: 600;
      text-align: center;
      color: #cfcfcf;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: color .2s;
    }
    .profile:hover .profile-img { transform: scale(1.05); border-color: rgba(255,255,255,.5); }
    .profile:hover .profile-name { color: #fff; }
    .profile:focus-visible { outline: 2px solid rgba(255,255,255,.6); outline-offset: 6px; border-radius: 12px; }

    /* ───────── Botones laterales ───────── */
    .side {
      position: fixed;
      left: 22px;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      gap: 16px;
      z-index: 5;
    }
    .orb {
      display: grid;
      place-items: center;
      width: 36px; height: 36px;
      padding: 0;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,.38);
      background: transparent;
      color: #dcdcdc;
      cursor: pointer;
      transition: border-color .3s, color .3s, box-shadow .4s, transform .2s;
    }
    .orb:hover { border-color: #fff; color: #fff; box-shadow: 0 0 14px rgba(255,255,255,.16); }
    .orb:active { transform: scale(.92); }
    .orb:focus-visible { outline: 2px solid rgba(255,255,255,.6); outline-offset: 3px; }
    .orb[aria-expanded="true"] {
      border-color: #fff;
      color: #fff;
      box-shadow: 0 0 0 3px rgba(255,255,255,.07), 0 0 18px rgba(255,255,255,.2);
    }
    .orb svg { width: 16px; height: 16px; fill: currentColor; }
    .orb path { fill: currentColor; }   /* anula la regla global path { fill: transparent } */

    /* Nota musical: se mece suavemente */
    .orb-note svg { transform-origin: 40% 80%; animation: note-sway 2.6s ease-in-out infinite; }
    @keyframes note-sway {
      0%, 100% { transform: translateY(0)    rotate(-9deg); }
      50%      { transform: translateY(-2px) rotate(9deg); }
    }

    /* Corazón: late */
    .orb-heart svg { animation: heartbeat 1.5s ease-in-out infinite; }
    @keyframes heartbeat {
      0%   { transform: scale(1); }
      14%  { transform: scale(1.24); }
      28%  { transform: scale(1); }
      42%  { transform: scale(1.15); }
      70%, 100% { transform: scale(1); }
    }

    /* ───────── Aparición del reproductor y del perfil ─────────
       .slot se abre/cierra con la clase "open" (la pone el script al pulsar cada botón) */
    .slot {
      max-width: 0;
      padding: 0;
      margin: 0;
      overflow: hidden;
      visibility: hidden;
      transition: max-width .9s var(--ease), max-height .9s var(--ease),
                  padding .9s var(--ease), margin .9s var(--ease),
                  visibility 0s linear .9s;
    }
    .slot.open {
      padding: 20px;      /* margen de aire para que no se recorten sombras ni el foco */
      margin: -20px;      /* ...y se compensa para que no afecte a la posición */
      visibility: visible;
      transition-delay: 0s;
    }
    .slot-player.open  { max-width: 320px; }
    .slot-profile.open { max-width: 180px; }
    .dock.both .slot-profile { margin-left: 8px; }   /* separación entre reproductor y perfil */

    /* Reproductor: se despliega desde el centro hacia los lados */
    .player {
      opacity: 0;
      clip-path: inset(0 50% round 14px);
      transform: translateY(12px);
      transition: opacity .6s ease, clip-path .9s var(--ease), transform .9s var(--ease);
    }
    .slot.open .player {
      opacity: 1;
      clip-path: inset(0 0 round 14px);
      transform: none;
    }

    /* Perfil: la foto se abre como un iris circular y el nombre sube después */
    .profile-img {
      opacity: 0;
      clip-path: circle(0% at 50% 50%);
      transform: scale(.7);
      transition: opacity .5s ease, clip-path .9s var(--ease), transform .9s var(--ease), border-color .3s;
    }
    .slot.open .profile-img {
      opacity: 1;
      clip-path: circle(50% at 50% 50%);
      transform: scale(1);
    }
    .slot.open .profile:hover .profile-img { transform: scale(1.05); border-color: rgba(255,255,255,.5); }
    .profile-name {
      opacity: 0;
      transform: translateY(8px);
      transition: opacity .5s ease, transform .8s var(--ease), color .2s;
    }
    .slot.open .profile-name {
      opacity: 1;
      transform: none;
      transition-delay: .3s, .3s, 0s;
    }

    /* ───────── Móvil ───────── */
    @media (max-width: 640px) {
      .dock { flex-direction: column; }
      /* en vertical, se abre hacia abajo en lugar de hacia el lado */
      .slot { max-width: none; max-height: 0; }
      .slot-player.open, .slot-profile.open { max-width: none; max-height: 220px; }
      .dock.both .slot-profile { margin-left: -20px; margin-top: 6px; }
      .side { left: 8px; gap: 12px; }
      .orb { width: 32px; height: 32px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .orb svg { animation: none; }
      .slot, .player, .profile-img, .profile-name { transition-duration: .01s !important; transition-delay: 0s !important; }
    }
  </style>
</head>

<body>

  <!-- ═════════ BOTONES LATERALES ═════════ -->
  <nav class="side" aria-label="Opciones">
    <button class="orb orb-note" id="btn-toggle-player" aria-label="Mostrar reproductor" aria-expanded="false" aria-controls="slot-player">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z"/></svg>
    </button>
    <button class="orb orb-heart" id="btn-toggle-profile" aria-label="Mostrar perfil" aria-expanded="false" aria-controls="slot-profile">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
    </button>
  </nav>

  <!-- ═════════ GIF + TEXTO ═════════ -->
  <div class="stage">
    <img src="Elvira.gif" alt="">

    <svg viewBox="0 0 211.9 104.6" xmlns:xlink="http://www.w3.org/1999/xlink" aria-label="En los infiernos donde estuve, no había ni fuegos ni diablos. Había personas que amaba.">
      <defs>
        <!-- Destello gris para la frase 1 (base blanca) -->
        <linearGradient id="shine-1" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="26" y2="8">
          <stop offset="0"   stop-color="#ffffff"/>
          <stop offset=".5"  stop-color="#7a7a7a"/>
          <stop offset="1"   stop-color="#ffffff"/>
          <animateTransform attributeName="gradientTransform" type="translate"
            values="-40 0; 240 0; 240 0" keyTimes="0; .7; 1"
            calcMode="spline" keySplines=".45 0 .2 1; 0 0 1 1"
            dur="8s" repeatCount="indefinite"/>
        </linearGradient>

        <!-- Destello gris para la frase 2 (interior transparente) -->
        <linearGradient id="shine-2" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="26" y2="8">
          <stop offset="0"   stop-color="#9c9c9c" stop-opacity="0"/>
          <stop offset=".5"  stop-color="#b4b4b4" stop-opacity=".95"/>
          <stop offset="1"   stop-color="#9c9c9c" stop-opacity="0"/>
          <animateTransform attributeName="gradientTransform" type="translate"
            values="-40 0; 240 0; 240 0" keyTimes="0; .7; 1"
            calcMode="spline" keySplines=".45 0 .2 1; 0 0 1 1"
            dur="8s" begin="3.5s" repeatCount="indefinite"/>
        </linearGradient>
      </defs>

      <path id="curve-1" d="M41.3,71.4V30.9c0-7.4,6-13.5,13.5-13.5h101.7c7.4,0,13.5,6,13.5,13.5v43c0,7.4-6,13.5-13.5,13.5H54.8
        c-7.4,0-13.5-6-13.5-13.5"/>
      <path id="curve-2" d="M176.6,33.8v42c0,9.5-7.7,17.2-17.2,17.2H51.8c-9.5,0-17.2-7.7-17.2-17.2V29c0-9.5,7.7-17.2,16.2-17.2h107.6
        c10.5,0,18.2,7.7,18.2,17.2v3.5"/>
      <text>
        <textPath id="text-1" href="#curve-1" xlink:href="#curve-1" startOffset="0%">
          En los infiernos donde estuve, no habia ni fuegos ni diablos.
        </textPath>
        <textPath id="text-2" href="#curve-2" xlink:href="#curve-2" startOffset="75%">
          Había personas que amaba.
        </textPath>
      </text>
    </svg>

  <!-- ═════════ REPRODUCTOR + PERFIL (se muestran con los botones laterales) ═════════ -->
  <div class="dock" id="dock">

    <div class="slot slot-player" id="slot-player">
    <div class="player" role="group" aria-label="Reproductor de música">
      <div class="track-info">
        <div class="track-title" id="track-title">—</div>
        <div class="track-artist" id="track-artist"></div>
      </div>

      <div class="progress-row">
        <span id="time-current">0:00</span>
        <input type="range" id="seek" min="0" max="100" step="0.1" value="0" aria-label="Posición de la canción">
        <span id="time-total">0:00</span>
      </div>

      <div class="controls">
        <div class="transport">
          <button class="btn" id="btn-prev" aria-label="Canción anterior">
            <svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9.5 12z" style="fill:currentColor"/></svg>
          </button>
          <button class="btn btn-play" id="btn-play" aria-label="Reproducir">
            <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z" style="fill:currentColor"/></svg>
          </button>
          <button class="btn btn-pause is-on" id="btn-pause" aria-label="Pausar">
            <svg viewBox="0 0 24 24"><path d="M6 5h4v14H6zM14 5h4v14h-4z" style="fill:currentColor"/></svg>
          </button>
          <button class="btn" id="btn-next" aria-label="Canción siguiente">
            <svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM4 5v14l10.5-7z" style="fill:currentColor"/></svg>
          </button>
        </div>

        <div class="volume">
          <button class="btn" id="btn-mute" aria-label="Silenciar">
            <svg id="icon-vol" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9zM16.5 12A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z" style="fill:currentColor"/></svg>
            <svg id="icon-mute" viewBox="0 0 24 24" hidden><path d="M3 9v6h4l5 5V4L7 9zM16.6 12l2.7-2.7-1.4-1.4-2.7 2.7-2.7-2.7-1.4 1.4 2.7 2.7-2.7 2.7 1.4 1.4 2.7-2.7 2.7 2.7 1.4-1.4z" style="fill:currentColor"/></svg>
          </button>
          <input type="range" id="volume" min="0" max="1" step="0.01" value="0.7" aria-label="Volumen">
        </div>
      </div>
    </div>
    </div>

    <!-- Perfil: cambia la imagen (src), el nombre y el enlace (href) -->
    <div class="slot slot-profile" id="slot-profile">
    <a class="profile" href="https://xat.me/Conductance" target="_blank" rel="noopener noreferrer">
      <img class="profile-img" src="fotoicono.png" alt="Foto de perfil">
      <span class="profile-name">Preciosa ♥</span>
    </a>
    </div>

  </div>
  </div>

  <audio id="audio" preload="metadata"></audio>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/2.1.3/TweenMax.min.js"></script>
  <script>
    /* ═════════════════════════════════════════════
       1) TEXTO QUE SE MUEVE CON EL RATÓN
       ═════════════════════════════════════════════ */
    const scale = (a, b, c, d, e) => (a - b) * (e - d) / (c - b) + d;
    const text1 = document.getElementById('text-1');
    const text2 = document.getElementById('text-2');

    const crazy = e => {
      const x = e.touches ? e.touches[0].clientX : e.clientX;
      TweenMax.to(text1, .6, {
        attr: { startOffset: `${scale(x, 0, window.innerWidth, 0, 75)}%` },
        ease: Power3.easeOut
      });
      TweenMax.to(text2, .8, {
        attr: { startOffset: `${scale(x, 0, window.innerWidth, 75, 0)}%` },
        ease: Power3.easeOut
      });
    };
    ['mousemove', 'touchstart', 'touchmove'].forEach(ev => {
      window.addEventListener(ev, crazy, { passive: true });
    });

    // Respeta a quien prefiere menos movimiento: detiene el destello
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      document.querySelector('.stage > svg').pauseAnimations();
    }


    /* ═════════════════════════════════════════════
       2) REPRODUCTOR
       ═════════════════════════════════════════════
       AÑADE TUS CANCIONES AQUÍ: una línea por canción.
       - title:  nombre que se muestra
       - artist: (opcional) artista
       - src:    ruta o URL del .mp3
       ───────────────────────────────────────────── */
    const playlist = [
      { title: 'LAS NOCHES', artist: 'Junior H', src: 'song1.mp3' },
      { title: 'Creep', artist: 'Radiohead', src: 'song2.mp3' },
      { title: 'CAPERUZA', artist: 'Fuerza Regida', src: 'song3.mp3' },
      { title: 'LAGUNAS ', artist: 'Peso Pluma, Jasiel Nuñez', src: 'song4.mp3' },
      { title: 'Dias Nublados', artist: 'Junior H', src: 'song5.mp3' },
      { title: 'Mucha Marihuana', artist: 'Cartel de Santa', src: 'song6.mp3' },
      { title: 'Se Volvieron Locos', artist: 'Kane Rodriguez', src: 'song7.mp3' },
      { title: 'El Rabbanito', artist: 'Dandy Hats', src: 'song8.mp3' },
      { title: 'Gané', artist: 'Victor Mendivil y Gabito Ballesteros', src: 'song9.mp3' },
      { title: 'Nací Para Amarte', artist: 'Junior H', src: 'song10.mp3' },
    ];

    const audio     = document.getElementById('audio');
    const titleEl   = document.getElementById('track-title');
    const artistEl  = document.getElementById('track-artist');
    const btnPlay   = document.getElementById('btn-play');
    const btnPrev   = document.getElementById('btn-prev');
    const btnNext   = document.getElementById('btn-next');
    const btnMute   = document.getElementById('btn-mute');
    const btnPause  = document.getElementById('btn-pause');
    const iconVol   = document.getElementById('icon-vol');
    const iconMute  = document.getElementById('icon-mute');
    const seek      = document.getElementById('seek');
    const volume    = document.getElementById('volume');
    const timeCur   = document.getElementById('time-current');
    const timeTot   = document.getElementById('time-total');

    let index = 0;

    const fmt = s => {
      if (!isFinite(s)) return '0:00';
      const m = Math.floor(s / 60);
      const r = Math.floor(s % 60).toString().padStart(2, '0');
      return `${m}:${r}`;
    };

    const paintRange = el => {
      const pct = ((el.value - el.min) / (el.max - el.min)) * 100;
      el.style.setProperty('--fill', pct + '%');
    };

    const setPlayingUI = playing => {
      btnPlay.classList.toggle('is-on', playing);
      btnPause.classList.toggle('is-on', !playing);
    };

    const loadTrack = (i, autoplay = false) => {
      index = (i + playlist.length) % playlist.length;
      const t = playlist[index];
      audio.src = t.src;
      titleEl.textContent = t.title;
      artistEl.textContent = t.artist || '';
      seek.value = 0; paintRange(seek);
      timeCur.textContent = '0:00';
      timeTot.textContent = '0:00';
      if (autoplay) audio.play().catch(() => setPlayingUI(false));
    };

    btnPlay.addEventListener('click', () => { audio.play().catch(() => {}); });
    btnPause.addEventListener('click', () => { audio.pause(); });
    btnNext.addEventListener('click', () => loadTrack(index + 1, !audio.paused));
    btnPrev.addEventListener('click', () => {
      // Si ya han pasado 3 s, reinicia la canción; si no, va a la anterior
      if (audio.currentTime > 3) { audio.currentTime = 0; return; }
      loadTrack(index - 1, !audio.paused);
    });

    audio.addEventListener('play',  () => setPlayingUI(true));
    audio.addEventListener('pause', () => setPlayingUI(false));
    audio.addEventListener('ended', () => loadTrack(index + 1, true));
    audio.addEventListener('loadedmetadata', () => { timeTot.textContent = fmt(audio.duration); });
    audio.addEventListener('timeupdate', () => {
      if (!audio.duration) return;
      seek.value = (audio.currentTime / audio.duration) * 100;
      paintRange(seek);
      timeCur.textContent = fmt(audio.currentTime);
    });

    seek.addEventListener('input', () => {
      if (audio.duration) audio.currentTime = (seek.value / 100) * audio.duration;
      paintRange(seek);
    });

    // Volumen
    const updateVolumeUI = () => {
      const muted = audio.muted || audio.volume === 0;
      iconVol.hidden = muted;
      iconMute.hidden = !muted;
      btnMute.setAttribute('aria-label', muted ? 'Activar sonido' : 'Silenciar');
    };
    volume.addEventListener('input', () => {
      audio.volume = volume.value;
      audio.muted = false;
      paintRange(volume);
      updateVolumeUI();
    });
    btnMute.addEventListener('click', () => {
      audio.muted = !audio.muted;
      updateVolumeUI();
    });

    // Inicio
    audio.volume = volume.value;
    paintRange(volume);
    paintRange(seek);
    loadTrack(0);

    /* ═════════════════════════════════════════════
       3) BOTONES LATERALES: mostrar / ocultar
       ═════════════════════════════════════════════ */
    const dock        = document.getElementById('dock');
    const slotPlayer  = document.getElementById('slot-player');
    const slotProfile = document.getElementById('slot-profile');

    const bindToggle = (btnId, slot, onOpen) => {
      const btn = document.getElementById(btnId);
      btn.addEventListener('click', () => {
        const open = slot.classList.toggle('open');
        btn.setAttribute('aria-expanded', open);
        dock.classList.toggle('both',
          slotPlayer.classList.contains('open') && slotProfile.classList.contains('open'));
        if (open && onOpen) onOpen();
      });
    };
    // Al mostrar el reproductor, la música empieza sola
    // (funciona porque viene de un clic del usuario; los navegadores bloquean el autoplay sin interacción)
    bindToggle('btn-toggle-player',  slotPlayer, () => {
      if (audio.paused) audio.play().catch(() => {});
    });
    bindToggle('btn-toggle-profile', slotProfile);
  </script>
</body>
</html>
